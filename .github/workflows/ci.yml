name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: rembg model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.rembg/models
          key: rembg-u2net-${{ hashFiles('backend/requirements.txt') }}
      - name: Testleri çalıştır
        run: python -m pytest -q

  mobile:
    name: Mobile (flutter analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - name: Bağımlılıkları al
        run: flutter pub get
      - name: Analiz
        run: flutter analyze
